<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --paper: #FFF8E7;
    --paper-2: #FBEFD2;
    --ink: #22261F;
    --ink-2: #5C6156;
    --forest: #1E5A3A;
    --leaf: #5FB56B;
    --sun: #FFC533;
    --coral: #E4623F;
    --line: #D9CDB0;
    --radius: 18px;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --display: "Jua", var(--sans);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.5;
    min-height: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; margin: 0; }

  /* ── 공통 부품 ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0;
    background: var(--forest); color: #fff; font-family: var(--display); font-size: 20px;
  }
  a.btn { text-decoration: none; }
  .btn.sun { background: var(--sun); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--forest); border: 2px solid var(--forest); }
  .btn.small { min-height: 40px; padding: 0 14px; font-size: 16px; border-radius: 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.block { width: 100%; }
  .field { display: block; margin: 14px 0; }
  .field span { display: block; font-size: 15px; color: var(--ink-2); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: #fff; font-size: 19px;
  }
  .field textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  .field input.pin { font-size: 30px; letter-spacing: .4em; text-align: center; font-family: var(--display); }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--paper-2); font-size: 16px; margin: 10px 0; }
  .msg.err { background: #FBE3DB; color: #8A2E17; }
  .msg.ok { background: #DDF3E0; color: #17502A; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 16px;
    max-width: 90vw; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .foot { text-align: center; font-size: 12px; color: var(--ink-2); margin-top: 40px; }
  .foot button { background: none; border: 0; color: var(--ink-2); text-decoration: underline; font-size: 12px; padding: 4px; }

  /* ── 로그인 ── */
  .hero { padding: 24px 0 8px; }
  .hero .kicker { font-size: 16px; color: var(--forest); margin: 0 0 4px; }
  .hero h1 { font-size: 40px; line-height: 1.1; color: var(--forest); }
  .hero p.notice { margin: 12px 0 0; color: var(--ink-2); }
  .ticket {
    margin-top: 20px; background: #fff; border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px;
  }

  /* ── 홈 ── */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 0 14px; }
  .topbar .team { font-family: var(--display); font-size: 30px; color: var(--forest); line-height: 1; }
  .topbar .sub { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
  .score { text-align: right; }
  .score b { display: block; font-family: var(--display); font-size: 42px; line-height: 1; color: var(--ink); }
  .score b small { font-size: 18px; margin-left: 2px; }
  .score span { font-size: 14px; color: var(--ink-2); }
  .trail { position: relative; height: 14px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin: 4px 0 22px; }
  .trail i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--leaf); border-radius: 999px; transition: width .5s ease; }

  .stamps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .stamps { grid-template-columns: repeat(3, 1fr); } }
  .stamp {
    position: relative; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px 12px; min-height: 140px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }
  .stamp .no { font-family: var(--display); font-size: 15px; color: var(--ink-2); }
  .stamp .title { font-family: var(--display); font-size: 20px; line-height: 1.2; color: var(--ink); }
  .stamp .place { font-size: 13px; color: var(--ink-2); margin-top: auto; }
  .stamp .pts { position: absolute; top: 10px; right: 12px; font-family: var(--display); font-size: 14px; color: var(--forest); }
  .stamp.done { border-color: var(--leaf); background: #F4FBF4; }
  .stamp.pending { border-color: var(--sun); background: #FFF9E0; }
  .stamp.wrong { border-color: var(--coral); }
  .seal {
    position: absolute; right: 8px; bottom: 8px; width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--leaf); color: var(--leaf); display: grid; place-items: center;
    font-family: var(--display); font-size: 18px; transform: rotate(-14deg); opacity: .9;
    box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px var(--leaf);
  }
  .seal.wait { border-color: var(--sun); color: #8A6A00; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px var(--sun); }
  .seal.press { animation: press .45s cubic-bezier(.2,1.4,.5,1); }
  @keyframes press { 0% { transform: rotate(-30deg) scale(3); opacity: 0; } 55% { transform: rotate(-14deg) scale(.85); opacity: 1; } 75% { transform: rotate(-14deg) scale(1.12); } 100% { transform: rotate(-14deg) scale(1); } }
  .stamp.shake { animation: shake .45s .35s; }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-2px, 1px) rotate(-1deg); } 50% { transform: translate(2px, -1px) rotate(1deg); } 80% { transform: translate(-1px, 0); } }
  @media (prefers-reduced-motion: reduce) { .seal.press { animation: none; } .trail i { transition: none; } }

  .board { margin-top: 28px; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .board h2 { font-size: 22px; color: var(--forest); margin-bottom: 6px; }
  .board ol { margin: 0; padding: 0; list-style: none; }
  .board li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--paper-2); }
  .board li.me { font-weight: 700; color: var(--forest); }
  .board li:first-child { border-top: 0; }

  /* ── 미션 시트(모달) ── */
  .sheet-bg { position: fixed; inset: 0; background: rgba(34,38,31,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto;
    border-radius: 22px 22px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 720px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .sheet-head h2 { font-size: 28px; line-height: 1.15; color: var(--forest); }
  .sheet-head .close { background: none; border: 0; font-size: 28px; line-height: 1; padding: 4px 8px; color: var(--ink-2); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; color: var(--ink-2); margin: 6px 0 14px; }
  .desc { font-size: 18px; line-height: 1.6; background: #fff; border-radius: 12px; padding: 12px 14px; border: 2px solid var(--line); }
  .hint { font-size: 15px; color: var(--ink-2); margin-top: 8px; }
  .choices { display: grid; gap: 10px; margin: 14px 0; }
  .choice { min-height: 54px; text-align: left; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 19px; }
  .choice.on { border-color: var(--forest); background: #E8F4EC; }
  .photo-box { margin: 14px 0; }
  .photo-box img { width: 100%; max-height: 320px; object-fit: contain; border-radius: 12px; background: #fff; border: 2px solid var(--line); }
  .photo-box label.btn { width: 100%; }
  .photo-box input[type=file] { display: none; }
  .actions { display: grid; gap: 10px; margin-top: 16px; }

  /* ── 교사 현황판 ── */
  .tbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 16px; }
  .tbar h1 { font-size: 26px; color: var(--forest); margin-right: auto; }
  .live { font-size: 13px; color: var(--ink-2); }
  .grid-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: var(--radius); background: #fff; }
  table.grid { border-collapse: collapse; min-width: 100%; font-size: 14px; }
  table.grid th, table.grid td { border-bottom: 1px solid var(--paper-2); padding: 8px 10px; text-align: center; white-space: nowrap; }
  table.grid th { font-family: var(--display); font-weight: 400; color: var(--forest); font-size: 15px; background: var(--paper-2); position: sticky; top: 0; }
  table.grid th:first-child, table.grid td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
  table.grid th:first-child { background: var(--paper-2); }
  table.grid td.total { font-family: var(--display); font-size: 17px; }
  .cell { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-family: var(--display); font-size: 14px; border: 0; background: var(--paper-2); color: var(--ink-2); }
  .cell.done { background: var(--leaf); color: #fff; }
  .cell.pending { background: var(--sun); color: var(--ink); }
  .cell.wrong { background: #FBE3DB; color: var(--coral); }
  .queue { margin-top: 24px; }
  .queue h2 { font-size: 22px; color: var(--forest); margin-bottom: 10px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card.pend { border-color: var(--sun); }
  .card .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card .who b { font-family: var(--display); font-size: 20px; font-weight: 400; color: var(--forest); }
  .card .who span { font-size: 13px; color: var(--ink-2); }
  .card .ans { margin: 8px 0; white-space: pre-wrap; font-size: 16px; }
  .card img { width: 100%; max-height: 360px; object-fit: contain; border-radius: 12px; background: var(--paper-2); margin: 8px 0; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .card .row input { width: 84px; min-height: 40px; border-radius: 10px; border: 2px solid var(--line); padding: 0 10px; text-align: center; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
  .tag.done { background: #DDF3E0; color: #17502A; } .tag.pending { background: #FFF1BF; color: #6B5200; } .tag.wrong { background: #FBE3DB; color: #8A2E17; }

  /* ── 우리 반 게시판 ── */
  .bhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 8px 0 12px; }
  .bhead h1 { font-size: 30px; color: var(--forest); line-height: 1.1; }
  .bhead .sub { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
  .ranks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 0 0 12px; }
  .rank { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .rank b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--ink-2); min-width: 18px; }
  .rank span { font-family: var(--display); font-size: 17px; color: var(--forest); white-space: nowrap; }
  .rank em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .rank.top { border-color: var(--sun); background: #FFF9E0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; -webkit-overflow-scrolling: touch; }
  .chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-size: 15px; }
  .chip.on { border-color: var(--forest); background: var(--forest); color: #fff; }
  .wall { column-count: 2; column-gap: 12px; }
  @media (min-width: 640px) { .wall { column-count: 3; } }
  @media (min-width: 1000px) { .wall { column-count: 4; } }
  .post { break-inside: avoid; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); margin: 0 0 12px; overflow: hidden; }
  .post img { display: block; width: 100%; background: var(--paper-2); }
  .post .body { padding: 10px 12px 12px; }
  .post .team { display: inline-block; font-family: var(--display); font-size: 15px; color: #fff; background: var(--forest); padding: 2px 10px; border-radius: 999px; }
  .post .mtitle { font-family: var(--display); font-size: 18px; line-height: 1.2; margin: 8px 0 4px; }
  .post .text { font-size: 15px; white-space: pre-wrap; line-height: 1.5; }
  .post .meta { font-size: 12px; color: var(--ink-2); margin-top: 6px; display: flex; justify-content: space-between; }
  .post.new { animation: pop .5s cubic-bezier(.2,1.4,.5,1); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .post.new { animation: none; } }
  .empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }

  /* ── 사진 공모전 ── */
  .award { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 15px; padding: 2px 10px; border-radius: 999px; background: var(--sun); color: var(--ink); }
  .award.a0 { background: #F2B705; } .award.a1 { background: #FFD95A; } .award.a2 { background: #DCE3E8; } .award.a3 { background: #E8C3A0; } .award.a4 { background: #DDF3E0; color: #17502A; }
  .post .award { margin-left: 6px; }
  .awardtbl { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
  .awardtbl span { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .judge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .entry { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .entry.won { border-color: var(--sun); box-shadow: 0 0 0 3px #FFF1BF; }
  .entry a.ph { display: block; background: var(--paper-2); }
  .entry img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .entry .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .entry .who { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .entry .who b { font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--forest); }
  .entry .ttl { font-size: 15px; }
  .abtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: auto; }
  .abtns button { min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font-family: var(--display); font-size: 15px; line-height: 1.1; padding: 2px; }
  .abtns button small { display: block; font-family: var(--sans); font-size: 11px; color: var(--ink-2); }
  .abtns button.on { border-color: var(--forest); background: var(--forest); color: #fff; }
  .abtns button.on small { color: #DDF3E0; }
  .contest-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--sun); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .contest-row b { font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--forest); }
  .contest-row span { font-size: 14px; color: var(--ink-2); }
  .contest-row .btn { margin-left: auto; }

  /* ── 좋아요 · 설치 안내 · 템플릿 고르기 ── */
  .like { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px; font-size: 14px; min-height: 30px; }
  .like.on { border-color: var(--coral); background: #FBE3DB; color: #8A2E17; }
  .like.on i { animation: heart .4s cubic-bezier(.2,1.4,.5,1); display: inline-block; }
  @keyframes heart { 0% { transform: scale(1); } 50% { transform: scale(1.6); } 100% { transform: scale(1); } }
  .install { background: #fff; border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); margin: 0 0 14px; display: flex; gap: 10px; align-items: center; }
  .install button.x { background: none; border: 0; font-size: 20px; color: var(--ink-2); margin-left: auto; padding: 0 4px; }
  .srcs { display: grid; gap: 8px; margin: 10px 0; }
  .src { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.35; }
  .src.on { border-color: var(--forest); background: #E8F4EC; }
  .src b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--forest); display: block; }
  .src small { color: var(--ink-2); }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .confetti i { position: absolute; top: -10px; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.4s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

  /* ── 마감 시계 · 행사 종료 · 전송 대기 ── */
  .clock { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: -8px 0 16px; font-size: 15px; }
  .clock b { font-family: var(--display); font-size: 22px; font-weight: 400; color: var(--forest); min-width: 64px; }
  .clock.soon b { color: var(--coral); } .clock.over { color: var(--ink-2); }
  .banner { background: #FBE3DB; color: #8A2E17; border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; font-size: 15px; }
  .seal.queued { border-color: var(--ink-2); color: var(--ink-2); box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px var(--ink-2); font-size: 14px; }
  .mimg { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); margin: 0 0 10px; background: var(--paper-2); }

  /* ── 내 행사 ── */
  .ev { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .ev.new { border-color: var(--sun); box-shadow: 0 0 0 3px #FFF1BF; }
  .ev .et { font-family: var(--display); font-size: 21px; color: var(--forest); line-height: 1.2; }
  .ev .em { font-size: 15px; color: var(--ink-2); margin: 4px 0 10px; }
  .ev .em b { color: var(--ink); letter-spacing: .05em; }
  .ev .eb { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ev .eb .btn { min-height: 46px; font-size: 17px; }
  .ev .el { font-size: 13px; color: var(--ink-2); margin-top: 8px; word-break: break-all; }

  /* ── QR 인쇄 ── */
  .print-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .qr-card { border: 2px solid var(--ink); border-radius: 14px; padding: 16px; text-align: center; page-break-inside: avoid; background: #fff; }
  .qr-card h3 { font-size: 24px; margin-bottom: 4px; }
  .qr-card .place { color: var(--ink-2); font-size: 15px; }
  .qr-card .qr { display: grid; place-items: center; margin: 12px auto; }
  .qr-card .code { font-family: var(--display); font-size: 34px; letter-spacing: .15em; }
  .qr-card .how { font-size: 13px; color: var(--ink-2); }
  @media print {
    body { background: #fff; } .app { padding: 0; max-width: none; }
    .no-print, .toast, .foot { display: none !important; }
    .print-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   설정 — 영쌤이 배포한 공용 Apps Script 웹 앱 URL (한 번만 설정)
   ============================================================ */
const CONFIG = {
  API: 'https://script.google.com/macros/s/AKfycbzDxJ3w3pht02tR9iZO9Dyk9epf6pb2W0Ft_nikzuuO6ZWpLCivAavthj5S9_wHAoRqPA/exec',
  STUDENT_POLL: 15000,   // 학생 앱 새로고침 간격(ms)
  TEACHER_POLL: 8000,    // 교사 현황판 새로고침 간격(ms)
  PHOTO_MAX: 1024,       // 사진 긴 변 최대 픽셀
};
const COPYRIGHT = '© 2026 영쌤클래스 · 교육용으로 제작 · 무단 복제·재배포 금지';

/* ───────── 상태 ───────── */
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
  sget: k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  sset: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
  sdel: k => { try { sessionStorage.removeItem(k); } catch {} },
};
const S = {
  boot: null,             // {title, notice, missions, teams}
  event: '',              // 행사 코드
  team: store.get('rally.team'),
  pin: store.get('rally.pin'),
  mine: [],               // 내 모둠 제출 내역
  board: [],              // 순위표
  view: 'loading',
  open: null,             // 열려 있는 미션 id
  teacherPw: '',
  tdata: null,
  timers: {},
  pressed: null,          // 방금 도장 찍힌 미션 (애니메이션용)
};
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');

/* ───────── 서버 통신 ───────── */
function resolveEvent() {
  const p = (new URL(location.href).searchParams.get('e') || '').trim().toUpperCase();
  if (p) {
    if (p !== store.get('rally.event')) { store.del('rally.team'); store.del('rally.pin'); S.team = ''; S.pin = ''; }
    store.set('rally.event', p); return p;
  }
  return store.get('rally.event');
}
function appLink(extra = '') {
  const base = location.origin + location.pathname;
  const q = new URLSearchParams(); if (S.event) q.set('e', S.event);
  const qs = q.toString();
  return base + (qs || extra ? '?' + qs + (qs && extra ? '&' : '') + extra : '');
}
async function api(payload) {
  if (payload.action !== 'auth_url' && !payload.event) payload.event = S.event;
  // text/plain 본문 = 브라우저 사전요청(preflight) 없는 '단순 요청'. Apps Script와 CORS 충돌을 피함.
  const res = await fetch(CONFIG.API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow',
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error('서버 응답을 읽지 못했어요 (' + res.status + '). 배포를 새 버전으로 다시 올렸는지 확인하세요.'); }
  if (!data.ok && data.error && !data.reason) throw new Error(data.error);
  return data;
}
function toast(text, ms = 2200) {
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(S.timers.toast); S.timers.toast = setTimeout(() => t.classList.remove('show'), ms);
}
function stopPolling() { clearInterval(S.timers.student); clearInterval(S.timers.teacher); clearInterval(S.timers.board); }

/* ───────── 헬퍼 ───────── */
function missionStatus(id) {
  const subs = S.mine.filter(s => s.missionId === id);
  if (subs.some(s => s.status === '완료' || s.status === '승인')) return 'done';
  if (subs.some(s => s.status === '검토중' || s.status === '전송대기')) return 'pending';
  if (subs.some(s => s.status === '오답' || s.status === '반려')) return 'wrong';
  return 'todo';
}
function myPoints() { return S.mine.filter(s => s.status === '완료' || s.status === '승인').reduce((a, s) => a + (s.points || 0), 0); }
function lastNote(id) { const s = S.mine.filter(x => x.missionId === id).slice(-1)[0]; return s ? s.note : ''; }
const TYPE_LABEL = { '장소인증': '장소 도착', '사진': '사진 미션', '퀴즈': '퀴즈', '기록': '관찰 기록', '공모전': '사진 공모전' };
const AWARD_NAMES = ['대상', '금상', '은상', '동상', '입선'];
const isPhotoType = m => m.type === '사진' || m.type === '공모전';
const awardBadge = a => a ? `<span class="award a${AWARD_NAMES.indexOf(a)}">🏆 ${esc(a)}</span>` : '';
function myAward(id) { const s = S.mine.filter(x => x.missionId === id && x.award).slice(-1)[0]; return s ? s.award : ''; }
const STATUS_CLASS = { '완료': 'done', '승인': 'done', '검토중': 'pending', '오답': 'wrong', '반려': 'wrong' };
function fmtTime(iso) { const d = new Date(iso); return isNaN(d) ? '' : `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }

/* ───────── 화면: 로딩/오류 ───────── */
function renderLoading(text = '불러오는 중…') {
  app.innerHTML = `<div class="hero"><p class="kicker">현장체험학습</p><h1>미션 랠리</h1><p class="notice">${esc(text)}</p></div>`;
}
function renderFatal(err) {
  app.innerHTML = `<div class="hero"><p class="kicker">현장체험학습</p><h1>미션 랠리</h1></div>
    <div class="msg err">${esc(err.message || err)}</div>
    <p class="live">행사 코드: ${esc(S.event || '(없음)')}</p>
    <button class="btn block" onclick="boot()">다시 시도</button>
    <p class="foot"><button onclick="leaveEvent()">다른 행사 코드 입력</button></p>${footer()}`;
}
function footer() {
  return `<p class="foot">${esc(COPYRIGHT)}<br><button onclick="goTeacher()">교사용 현황판</button> · <button onclick="leaveEvent()">다른 행사</button></p>`;
}
function leaveEvent() {
  stopPolling(); S.event = ''; S.team = ''; S.pin = ''; S.boot = null; S.mine = [];
  store.del('rally.event'); store.del('rally.team'); store.del('rally.pin');
  history.replaceState(null, '', location.pathname); renderStart();
}

/* ───────── 내 행사 (구글 로그인 후) ───────── */
function goMine() { store.sget('rally.sid') ? renderMine() : startGoogle(); }
async function renderMine(highlight = '') {
  stopPolling(); S.view = 'mine';
  app.innerHTML = `<div class="hero"><p class="kicker">선생님</p><h1>내 행사</h1><p class="notice">불러오는 중…</p></div>`;
  let d;
  try { d = await api({ action: 'my_events', sid: store.sget('rally.sid') }); S.mdata = d; }
  catch (e) {
    if (/SESSION_EXPIRED/.test(e.message)) {
      store.sdel('rally.sid');
      app.innerHTML = `<div class="hero"><p class="kicker">선생님</p><h1>내 행사</h1></div>
        <div class="msg">로그인한 지 30분이 지났어요. 다시 로그인해 주세요.</div>
        <button class="btn block" id="gBtn" onclick="startGoogle()">Google로 시작하기</button>${footer()}`;
    } else renderFatal(e);
    return;
  }
  const appBase = location.origin + location.pathname;
  const cards = d.events.map(ev => `
    <div class="ev ${ev.code === highlight ? 'new' : ''}">
      <div class="et">${esc(ev.title)} ${ev.code === highlight ? '<span class="tag pending">방금 만듦</span>' : ''}</div>
      <div class="em">코드 <b>${esc(ev.code)}</b> · 비밀번호 <b>${esc(ev.pw || '?')}</b> · ${esc(ev.created)}</div>
      ${ev.ok ? `<div class="eb">
          <button class="btn small" onclick="openEventDashboard('${esc(ev.code)}','${esc(ev.pw)}')">현황판 열기</button>
          <a class="btn small ghost" href="${esc(ev.url)}" target="_blank" rel="noopener">시트 열기</a></div>
        <div class="el">학생용 링크 <code style="user-select:all">${esc(appBase + '?e=' + ev.code)}</code>
          <button class="btn small ghost" style="min-height:30px;font-size:13px" onclick="copyText('${esc(appBase + '?e=' + ev.code)}')">복사</button></div>`
      : `<div class="el">행사 시트를 찾을 수 없어요(드라이브에서 지웠을 수 있어요).</div>`}
    </div>`).join('');
  app.innerHTML = `
    <div class="hero"><p class="kicker">선생님</p><h1>내 행사</h1><p class="notice">${esc(d.email)} 계정으로 만든 행사예요.</p></div>
    ${cards || '<div class="msg">아직 만든 행사가 없어요. 아래에서 첫 행사를 만들어 보세요.</div>'}
    <div class="ticket">
      <h2 style="font-size:22px;color:var(--forest)">새 행사 만들기</h2>
      <label class="field"><span>행사 이름</span><input id="newTitle" maxlength="60" placeholder="예: 2026 가을 경남수목원 체험학습"></label>
      <label class="field"><span>모둠 수</span><input id="newTeams" inputmode="numeric" value="6" style="max-width:120px"></label>
      <p style="margin:6px 0 4px;font-size:15px;color:var(--ink-2)">미션은 어떻게 채울까요?</p>
      ${sourcePicker(d)}
      <button class="btn sun block" id="newBtn" onclick="createEventFromApp()">새 행사 만들기</button>
      <p style="margin:10px 0 0;font-size:14px;color:var(--ink-2)">선생님 드라이브에 미션 시트와 사진 폴더가 생기고, 행사 코드와 비밀번호가 나와요.</p>
    </div>
    <p class="foot">${esc(COPYRIGHT)}<br><button onclick="leaveEvent()">처음 화면으로</button></p>`;
}
S.src = { source: 'template', template: '' };
function sourcePicker(d) {
  const tpls = d.templates || [];
  if (S.src.source === 'template' && !S.src.template && tpls.length) S.src.template = tpls[0].name;
  if (!tpls.length && S.src.source === 'template') S.src.source = 'sample';
  const opt = (source, template, label, sub) => `<button class="src ${S.src.source === source && (S.src.template || '') === (template || '') ? 'on' : ''}" onclick="pickSource('${esc(source)}','${esc(template || '')}')"><b>${label}</b><small>${sub}</small></button>`;
  return `<div class="srcs">
    ${tpls.map(t => opt('template', t.name, `📋 ${esc(t.name)}`, `${t.count}개 · ${esc(t.titles.join(', '))}…`)).join('')}
    ${opt('copy', '', '🔁 다른 행사에서 복사', '지난 행사나 옆 반 행사 코드로 미션 가져오기')}
    ${S.src.source === 'copy' ? `<div class="field" style="margin:0 0 4px"><input id="copyFrom" class="pin" maxlength="6" autocapitalize="characters" placeholder="행사 코드" value="${esc(S.src.from || '')}" oninput="S.src.from=this.value">
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:15px"><input type="checkbox" id="copyTeams" ${S.src.copyTeams ? 'checked' : ''} onchange="S.src.copyTeams=this.checked" style="width:22px;height:22px"> 모둠·PIN도 같이 복사</label></div>` : ''}
    ${opt('sample', '', '🧪 예시 미션 6개', '유형별 예시를 보고 고쳐 쓰기')}
    ${opt('blank', '', '📄 빈 시트', '처음부터 직접 입력')}
  </div>`;
}
function pickSource(source, template) {
  S.src = Object.assign({}, S.src, { source, template });
  const box = document.querySelector('.srcs'); if (box) box.outerHTML = sourcePicker(S.mdata || {});
}
async function createEventFromApp() {
  const title = $('#newTitle').value.trim();
  if (!title) { toast('행사 이름을 써 주세요'); return; }
  const payload = { action: 'create_event', sid: store.sget('rally.sid'), title, n: Math.random().toString(36).slice(2) + Date.now(),
    source: S.src.source, template: S.src.template, from: (S.src.from || '').trim().toUpperCase(), copyTeams: !!S.src.copyTeams,
    teamCount: Number($('#newTeams').value) || 0 };
  if (payload.source === 'copy' && !payload.from) { toast('복사할 행사 코드를 넣어 주세요'); return; }
  const btn = $('#newBtn'); btn.disabled = true; btn.textContent = '만드는 중… (10초쯤 걸려요)';
  try {
    const r = await api(payload);
    toast(`새 행사 ${r.code}을(를) 만들었어요`);
    renderMine(r.code);
  } catch (e) {
    btn.disabled = false; btn.textContent = '새 행사 만들기';
    if (/SESSION_EXPIRED/.test(e.message)) { store.sdel('rally.sid'); renderMine(); } else toast(e.message);
  }
}
async function openEventDashboard(code, pw) {
  if (code !== store.get('rally.event')) { store.del('rally.team'); store.del('rally.pin'); S.team = ''; S.pin = ''; }
  S.event = code; store.set('rally.event', code);
  if (pw) store.sset('rally.pw.' + code, pw);
  S.teacherPw = '';
  history.replaceState(null, '', appLink());
  renderLoading();
  try { S.boot = await api({ action: 'bootstrap' }); goTeacher(); } catch (e) { renderFatal(e); }
}

/* ───────── 화면: 시작(행사 코드 / 선생님 시작) ───────── */
function renderStart(err = '') {
  S.view = 'start';
  app.innerHTML = `
    <div class="hero"><p class="kicker">현장체험학습</p><h1>미션 랠리</h1>
      <p class="notice">선생님이 준 링크나 QR로 들어오면 바로 시작돼요. 행사 코드만 있다면 아래에 입력하세요.</p></div>
    <div class="ticket">
      <label class="field"><span>행사 코드</span><input id="ev" class="pin" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></label>
      ${err ? `<div class="msg err">${esc(err)}</div>` : ''}
      <button class="btn sun block" id="evBtn">입장하기</button>
    </div>
    <div class="ticket" style="margin-top:14px">
      <h2 style="font-size:22px;color:var(--forest)">선생님이신가요?</h2>
      <p style="margin:6px 0 10px;color:var(--ink-2);font-size:15px">Google 계정으로 로그인하면 <b>내 행사 목록</b>(행사 코드·비밀번호·현황판)이 나오고, 거기서 <b>새 행사</b>도 만들 수 있어요. 기록은 모두 선생님 드라이브에 저장됩니다.</p>
      <button class="btn block" id="gBtn">Google로 시작하기</button>
    </div>
    <p class="foot">${esc(COPYRIGHT)}</p>`;
  $('#evBtn').onclick = () => {
    const v = $('#ev').value.trim().toUpperCase();
    if (!v) return renderStart('행사 코드를 입력하세요');
    S.event = v; store.set('rally.event', v); boot();
  };
  $('#ev').addEventListener('keydown', e => { if (e.key === 'Enter') $('#evBtn').click(); });
  $('#gBtn').onclick = goMine;
}
async function startGoogle() {
  const btn = $('#gBtn'); if (btn) { btn.disabled = true; btn.textContent = '준비 중…'; }
  try {
    const r = await api({ action: 'auth_url', appUrl: location.origin + location.pathname });
    location.href = r.url;
  } catch (e) { if (btn) { btn.disabled = false; btn.textContent = 'Google로 시작하기'; } toast(e.message); }
}

/* ───────── 화면: 로그인 ───────── */
function renderLogin(err = '') {
  const b = S.boot;
  const url = new URL(location.href);
  const code = url.searchParams.get('code');
  app.innerHTML = `
    <div class="hero">
      <p class="kicker">현장체험학습 · 행사 코드 ${esc(S.event)}</p>
      <h1>${esc(b.title)}</h1>
      ${b.notice ? `<p class="notice">${esc(b.notice)}</p>` : ''}
    </div>
    <div class="ticket">
      <label class="field"><span>우리 모둠</span>
        <select id="team">${b.teams.map(t => `<option ${t === S.team ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <label class="field"><span>모둠 PIN (선생님이 알려준 숫자)</span>
        <input id="pin" class="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"></label>
      ${err ? `<div class="msg err">${esc(err)}</div>` : ''}
      ${code ? `<div class="msg">장소 QR을 찍었네요! 로그인하면 바로 이어져요.</div>` : ''}
      <button class="btn sun block" id="loginBtn">출발하기</button>
    </div>${footer()}`;
  $('#loginBtn').onclick = login;
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
}
async function login() {
  const team = $('#team').value, pin = $('#pin').value.trim();
  if (!pin) return renderLogin('PIN을 입력하세요');
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '확인 중…';
  try {
    S.team = team; S.pin = pin;
    store.set('rally.team', team); store.set('rally.pin', pin);
    await refreshStudent(true);   // state 요청 한 번으로 PIN 확인 + 기록 불러오기

    if (!Array.isArray(d.mine)) throw new Error('서버 응답이 예상과 달라요: ' + JSON.stringify(d).slice(0, 160));

function nextDeadline() {

function onPhoto(input) {

/* ───────── 도장 효과 (소리 + 색종이) ───────── */
function stampFx() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const ctx = stampFx.ctx || (stampFx.ctx = new AC());
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + .12);
      g.gain.setValueAtTime(.6, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .2);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'sine'; o2.frequency.setValueAtTime(880, t + .12); o2.frequency.setValueAtTime(1320, t + .2);
      g2.gain.setValueAtTime(.25, t + .12); g2.gain.exponentialRampToValueAtTime(.001, t + .45);
      o2.connect(g2).connect(ctx.destination); o2.start(t + .12); o2.stop(t + .5);
    }
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([40, 30, 60]);
  const colors = ['#FFC533', '#5FB56B', '#E4623F', '#1E5A3A', '#fff'];
  const box = document.createElement('div'); box.className = 'confetti';
  for (let i = 0; i < 36; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * .3) + 's'; p.style.animationDuration = (1 + Math.random() * .8) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2200);
}

/* ───────── 전송 실패 자동 재시도 ───────── */
function readQueue() { try { return JSON.parse(localStorage.getItem('rally.queue') || '[]'); } catch { return []; } }
function writeQueue(q) { try { localStorage.setItem('rally.queue', JSON.stringify(q)); return true; } catch { return false; } }
function queueSubmission(payload) {
  const q = readQueue().filter(x => !(x.event === S.event && x.team === S.team && x.missionId === payload.missionId));
  q.push(Object.assign({ event: S.event, queuedAt: Date.now() }, payload));
  return writeQueue(q);
}
function applyQueue() {
  readQueue().filter(x => x.event === S.event && x.team === S.team).forEach(x => {
    if (!S.mine.some(y => y.missionId === x.missionId && (y.status === '완료' || y.status === '승인' || y.status === '검토중' || y.status === '전송대기')))
      S.mine.push({ missionId: x.missionId, status: '전송대기', points: 0, answer: x.answer || '', photo: x.photo || '', time: new Date(x.queuedAt).toISOString(), note: '', award: '' });
  });
}
let flushing = false;
async function flushQueue() {
  if (flushing || !S.team) return;
  const q = readQueue(); if (!q.length) return;
  flushing = true;
  try {
    for (const item of q) {
      if (item.event !== S.event || item.team !== S.team) continue;
      const { event, queuedAt, ...payload } = item;
      let r;
      try { r = await api(Object.assign({}, payload, { pin: S.pin })); }
      catch (e) { if (isNetworkError(e)) break; r = { ok: false, error: e.message }; }
      writeQueue(readQueue().filter(x => !(x.event === item.event && x.team === item.team && x.missionId === item.missionId)));
      const m = S.boot.missions.find(x => x.id === item.missionId);
      if (r.ok) toast(`📡 ${m ? m.title : '미션'} 보냈어요!` + (r.status === '완료' ? ` +${r.points}점` : ''));
      else toast(`${m ? m.title : '미션'}: ${r.error}`);
      S.mine = S.mine.filter(x => !(x.missionId === item.missionId && x.status === '전송대기'));
    }
  } finally { flushing = false; }
  await refreshStudent(false);
}
function isNetworkError(e) { return e instanceof TypeError || /서버 응답을 읽지 못했어요|Failed to fetch|Load failed|NetworkError/i.test(e.message || ''); }
window.addEventListener('online', () => flushQueue());
setInterval(() => { if (S.view === 'home' && readQueue().length) flushQueue(); }, 20000);

async function submitMission(id) {
  const m = S.boot.missions.find(x => x.id === id);
  grabDraft();
  const isEdit = S.editing === id;
  const payload = { action: 'submit', team: S.team, pin: S.pin, missionId: id, code: draft.code, edit: isEdit };
  if (m.type === '퀴즈') payload.answer = m.freeText ? draft.answer : draft.choice;
  if (m.type === '기록' || isPhotoType(m)) payload.answer = draft.answer;
  if (m.contest && !isEdit && !draft.answer.trim()) return renderSheet(m, '작품 제목을 지어 주세요');
  if (isPhotoType(m)) {
    if (!draft.photo && !isEdit) return renderSheet(m, '먼저 사진을 찍어 주세요');
    if (draft.photo) { payload.photo = draft.photo; payload.photoType = 'image/jpeg'; }
  }
  if (m.type === '퀴즈' && !payload.answer) return renderSheet(m, '답을 고르거나 써 주세요');
  if (m.needCode && !draft.code && !isEdit) return renderSheet(m, '장소 코드를 입력하세요');
  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = '보내는 중…';
  try {
    const r = await api(payload);
    if (!r.ok) return renderSheet(m, r.error);
    if (r.edited) toast('수정했어요. 선생님이 확인하면 도장이 찍혀요.');
    else if (r.status === '완료') { toast(`도장 쾅! +${r.points}점`); S.pressed = id; stampFx(); }
    else if (r.status === '검토중' && m.contest) toast('출품했어요! 담임선생님이 심사해요.');
    else if (r.status === '검토중') toast('제출했어요. 선생님이 확인하면 도장이 찍혀요.');
    else if (r.status === '오답') toast('정답이 아니에요. 다시 도전!');
    S.editing = null;
    closeMission();
    const entry = { missionId: id, status: r.status, points: r.points || 0, answer: payload.answer || '', photo: r.photo || '', time: new Date().toISOString(), note: '', award: '' };
    if (r.edited) { const i = S.mine.map(x => x.missionId).lastIndexOf(id); if (i >= 0) S.mine[i] = entry; else S.mine.push(entry); }
    else S.mine.push(entry);
    renderHome();
    refreshStudent(false);
  } catch (e) {
    if (isNetworkError(e) && !isEdit) {
      if (queueSubmission(payload)) {
        toast('📡 신호가 약해요. 신호가 잡히면 자동으로 보낼게요', 3500);
        S.editing = null; closeMission();
        S.mine.push({ missionId: id, status: '전송대기', points: 0, answer: payload.answer || '', photo: payload.photo || '', time: new Date().toISOString(), note: '', award: '' });
        renderHome();
      } else renderSheet(m, '신호가 약하고 저장 공간도 부족해요. 잠시 뒤 다시 눌러 주세요.');
    } else renderSheet(m, e.message);
  }
}

async function doReplace(source, template, from) {

    const r = await api({ action: 'replace_missions', pw: S.teacherPw, source, template, from });

        <div class="mtitle">${esc(mTitle(p.missionId))}</div>
        ${p.answer && p.answer !== '도착' ? `<div class="text">${esc(p.answer)}</div>` : (p.type === '장소인증' ? '<div class="text">도착 완료!</div>' : '')}
        <div class="meta"><span>${p.status === '검토중' ? (p.type === '공모전' ? '심사 중' : '선생님 확인 중') : `+${p.points}점`}</span>
          ${likeBtn(p)}<span>${fmtTime(p.time)}</span></div></div></div>`;
  app.innerHTML = `
    <div class="bhead"><div><h1>우리 반 미션 게시판</h1><div class="sub">${esc(d.title)} · 완료 ${done}개 · ${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 갱신</div></div>
      </div>
    <div class="ranks">${d.leaderboard.map((r, i) => `<div class="rank ${i === 0 && r.points > 0 ? 'top' : ''}"><b>${i + 1}</b><span>${esc(r.team)}</span><em>${r.points}점 · ${r.done}개</em></div>`).join('')}</div>
    <div class="chips"><button class="chip ${S.bfilter ? '' : 'on'}" onclick="setBoardFilter('')">전체</button>
      ${d.posts.some(p => p.award) ? `<button class="chip ${S.bfilter === '__award' ? 'on' : ''}" onclick="setBoardFilter('__award')">🏆 수상작</button>` : ''}
      ${d.posts.some(p => (p.likes || []).length) ? `<button class="chip ${S.bfilter === '__like' ? 'on' : ''}" onclick="setBoardFilter('__like')">❤️ 인기</button>` : ''}
      ${d.missions.map(m => `<button class="chip ${S.bfilter === m.id ? 'on' : ''}" onclick="setBoardFilter('${esc(m.id)}')">${esc(m.title)}</button>`).join('')}</div>
    ${posts.length ? `<div class="wall">${posts.map(card).join('')}</div>` : '<div class="empty">아직 올라온 미션이 없어요. 첫 도장을 찍어 보세요!</div>'}
    <p class="foot">${esc(COPYRIGHT)}<br>${S.team ? '<button onclick="backToStudent()">우리 모둠 화면으로</button>' : '<button onclick="backToStudent()">미션 하러 가기</button>'} · <button onclick="goTeacher()">교사용</button></p>`;
}
function setBoardFilter(id) { S.bfilter = id; renderBoard(); }
function likeBtn(p) {
  const likes = p.likes || []; const mine = S.team && likes.includes(S.team);
  const canLike = S.team && S.pin && p.team !== S.team;
  return `<button class="like ${mine ? 'on' : ''}" ${canLike ? `onclick="toggleLike('${p.id}')"` : 'disabled'} title="${likes.join(', ')}"><i>${mine ? '❤️' : '🤍'}</i>${likes.length}</button>`;
}
async function toggleLike(id) {
  const p = (S.bdata.posts || []).find(x => x.id === id); if (!p) return;
  const had = (p.likes || []).includes(S.team);
  p.likes = had ? p.likes.filter(t => t !== S.team) : [...(p.likes || []), S.team];
  renderBoard();
  try { const r = await api({ action: 'like', team: S.team, pin: S.pin, id }); if (!r.ok) toast(r.error); }
  catch (e) { toast(e.message); p.likes = had ? [...p.likes, S.team] : p.likes.filter(t => t !== S.team); renderBoard(); }
}

/* ───────── QR·코드 인쇄 ───────── */
function renderPrint() {
  const ms = S.tdata.missions.filter(m => m.code);
  const base = location.origin + location.pathname;
  app.innerHTML = `
    <div class="tbar no-print"><h1>장소 QR · 코드</h1><button class="btn small" onclick="window.print()">인쇄</button><button class="btn small ghost" onclick="renderTeacher()">현황판으로</button></div>
    <p class="live no-print">QR을 찍으면 앱이 열리고 코드가 자동 입력돼요. 카메라가 없으면 숫자 코드를 직접 입력하면 됩니다. 학생용 링크: <b>${esc(appLink())}</b></p>
    <div class="print-grid">${ms.map((m, i) => `<div class="qr-card"><h3>${esc(m.title)}</h3><div class="place">${esc(m.place)}</div>
      <div class="qr" id="qr-${i}"></div><div class="code">${esc(m.code)}</div><div class="how">QR을 찍거나 위 숫자를 앱에 입력하세요</div></div>`).join('')}
    ${ms.length ? '' : '<div class="msg">장소코드가 있는 미션이 없어요. 미션 시트의 장소코드 열을 채우세요.</div>'}</div>
    <p class="foot">${esc(COPYRIGHT)}</p>`;
  if (typeof QRCode === 'undefined') { toast('QR 라이브러리를 불러오지 못했어요. 숫자 코드로 인쇄돼요.'); return; }
  ms.forEach((m, i) => new QRCode($('#qr-' + i), { text: appLink('code=' + encodeURIComponent(m.code)), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }));
}

/* ───────── 시작 ───────── */
async function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('sid')) {
    store.sset('rally.sid', qs.get('sid'));
    qs.delete('sid'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : ''));
    S.event = store.get('rally.event');
    return renderMine();
  }
  S.event = resolveEvent();
  const hp = new URLSearchParams(location.hash.slice(1)).get('pw');
  if (hp && S.event) { store.sset('rally.pw.' + S.event, hp); S.teacherPw = ''; history.replaceState(null, '', location.pathname + location.search); }
  if (!S.event) return renderStart();
  renderLoading();
  try {
    S.boot = await api({ action: 'bootstrap' });
    const mode = new URL(location.href).searchParams.get('mode');
    if (mode === 'teacher') { history.replaceState(null, '', appLink()); return goTeacher(); }
    if (mode === 'board') return goBoard();
    S.team ? refreshStudent(true) : renderLogin();
  } catch (e) {
    if (/행사 코드/.test(e.message)) { store.del('rally.event'); S.event = ''; return renderStart(e.message); }
    renderFatal(e);
  }
}
boot();
</script>
</body>
</html>
